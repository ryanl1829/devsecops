apiVersion: v1
kind: Pod
metadata:
  name: ollama-pod
  labels:
    app: ollama
spec:
  containers:
    - name: ollama
      image: ollama/ollama:latest
      ports:
        - containerPort: 11434
          name: http
      lifecycle:
        postStart:
          exec:
            command: ['sh', '-c', 'sleep 5 && ollama pull qwen3:0.6b']
