integration-test:
  image: $UV_IMAGE

  services:
    - name: ollama/ollama:latest
      alias: ollama

  variables:
    OLLAMA_URL: "http://ollama:11434"
    OLLAMA_MODEL: "qwen3:0.6b"
    VISIT_COUNTER_FILE: "/tmp/visits.txt"

  before_script:
    - apk add --no-cache curl
    - |
      echo "waiting for ollama..."
      for i in $(seq 1 30); do
        if curl -sf "${OLLAMA_URL}/api/tags" >/dev/null 2>&1; then
          echo "ollama ready after ${i}0s-ish"
          break
        fi
        sleep 2
      done
      curl -sf "${OLLAMA_URL}/api/tags" >/dev/null 2>&1 || {
        echo "ollama service never became reachable"
        exit 1
      }
    - |
      echo "pulling ${OLLAMA_MODEL}..."
      curl -sf -X POST "${OLLAMA_URL}/api/pull" \
        -H "Content-Type: application/json" \
        -d "{\"name\": \"${OLLAMA_MODEL}\", \"stream\": false}" \
        --max-time 300
  script:
    - cd project/images/web-service
    - uv sync
    - uv run pytest -v tests/test_integration.py
