stages:
  - test
  - build
  - deploy

variables:
  UV_IMAGE: "ghcr.io/astral-sh/uv:python3.14-alpine"
  UV_LINK_MODE: copy

unit-test:
  stage: test
  image: $UV_IMAGE
  script:
    - cd project/images/web-service/
    - echo "Installing dependencies and running tests..."
    - uv sync
    - uv run pytest -v tests/test_unit.py

lint:
  stage: test
  image: $UV_IMAGE
  script:
    - cd project/images/web-service
    - uv sync
    - uv run ruff check src/

validate-k8s-manifests:
  stage: test
  script:
    - |
      curl -Lo kubeconform.tar.gz \
      https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
    - tar xzf kubeconform.tar.gz kubeconform
    - ./kubeconform -summary project/services

integration-test:
  stage: test
  image: $UV_IMAGE

  services:
    - name: ollama/ollama:latest
      alias: ollama

  variables:
    OLLAMA_URL: "http://ollama:11434"
    OLLAMA_MODEL: "qwen3:0.6b"
    VISIT_COUNTER_FILE: "/tmp/visits.txt"

  before_script:
    - apk add --no-cache curl
    - |
      echo "waiting for ollama..."
      for i in $(seq 1 30); do
        if curl -sf "${OLLAMA_URL}/api/tags" >/dev/null 2>&1; then
          echo "ollama ready after ${i}0s-ish"
          break
        fi
        sleep 2
      done
      curl -sf "${OLLAMA_URL}/api/tags" >/dev/null 2>&1 || {
        echo "ollama service never became reachable"
        exit 1
      }
    - |
      echo "pulling ${OLLAMA_MODEL}..."
      curl -sf -X POST "${OLLAMA_URL}/api/pull" \
        -H "Content-Type: application/json" \
        -d "{\"name\": \"${OLLAMA_MODEL}\", \"stream\": false}" \
        --max-time 300
  script:
    - cd project/images/web-service
    - uv sync
    - uv run pytest -v tests/test_integration.py

build-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: $CI_REGISTRY_IMAGE/web-server
  script:
    - IMAGE_TAG=$IMAGE_NAME:$(git rev-parse HEAD:project/images/web-service)
    - echo "IMAGE_TAG=${IMAGE_TAG}" >> build.env
    - echo "Building image ${IMAGE_TAG}"
    - docker build project/images/web-service -t $IMAGE_TAG
    - docker save -o web-service.tar $IMAGE_TAG
  artifacts:
    name: "docker-image-$CI_COMMIT_SHORT_SHA"
    paths:
      - web-service.tar
    expire_in: 1 day
    reports:
      dotenv: build.env

deploy-image:
  stage: deploy
  dependencies:
    - build-image
  image: docker:27-cli
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" |
      docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.com"
  script:
    - |
      sed -i "s|image: ${CI_REGISTRY_IMAGE}.*|image: ${IMAGE_TAG}|g" \
        project/services/web-service.yaml
    - git diff --quiet || TAG_CHANGED=true
    - |
      if [ "$TAG_CHANGED" = true ]; then
        echo "Changes to docker image.  Pushing new image."
        docker load -i web-service.tar
        docker push $IMAGE_TAG
        git add project/services/web-service.yaml
        git commit -m "Update web-service image tag [skip ci]
      Now set to ${IMAGE_TAG}"
        git push https://oauth2:${GITLAB_WRITE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:main
      else
        echo "Docker image unchanged."
      fi
