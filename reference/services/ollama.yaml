apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: dso-project
  labels:
    app: ollama
spec:
  selector:
    matchLabels:
      app: ollama
  replicas: 1
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          lifecycle:
            postStart:
              exec:
                command: ['sh', '-c', 'sleep 5 && ollama pull qwen3:0.6b']
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: dso-project
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
