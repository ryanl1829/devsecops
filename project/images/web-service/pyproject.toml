[project]
name = "web-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.40.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "ollama>=0.6.2",
]

[project.scripts]
web-service = "web_service:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
