apiVersion: v1
kind: Pod
metadata:
  name: web-pod
  labels:
    app: web-service
spec:
  containers:
   -  name: web-container
      image:  web-service:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8000 
          name: "http"
      volumeMounts:
       -  mountPath: /var/lib/web-service/
          name: visits-volume
  volumes:
   - name: visits-volume
     persistentVolumeClaim:
      claimName: web-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-pvc
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi